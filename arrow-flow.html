<script>
(function () {
  'use strict';

  /* ---------- 常量 ---------- */
  var DIRS = [[-1, 0], [0, 1], [1, 0], [0, -1]];   // 0上 1右 2下 3左
  var PAL = ['#38bdf8', '#fbbf24', '#a78bfa', '#fb7185', '#34d399', '#f472b6', '#60a5fa', '#facc15'];
  // cover 设到超过算法极限，等价于「尽力填满」；实际密度由可放置性决定
  // pair = 剩余空格优先凑成 2 格线的概率，其余走单格；hole = 故意留空的概率（留出呼吸感）
  var LEVELS = [
    { name: '简单', R: 8, C: 8, cover: 0.92, minLen: 2, maxLen: 4, tries: 12, pair: 0.55, hole: 0.06 },
    { name: '普通', R: 10, C: 10, cover: 0.92, minLen: 3, maxLen: 5, tries: 12, pair: 0.60, hole: 0.06 },
    { name: '困难', R: 12, C: 12, cover: 0.92, minLen: 3, maxLen: 6, tries: 12, pair: 0.65, hole: 0.06 },
    { name: '地狱', R: 14, C: 14, cover: 0.92, minLen: 3, maxLen: 7, tries: 12, pair: 0.70, hole: 0.06 }
  ];
  var KEY = 'arrowlines.v2';

  /* ---------- dom ---------- */
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var wrap = document.getElementById('wrap');
  var elLeft = document.getElementById('left');
  var elMv = document.getElementById('mv');
  var elSub = document.getElementById('sub');
  var elMask = document.getElementById('mask');
  var elMt = document.getElementById('mt');
  var elMp = document.getElementById('mp');
  var elRotate = document.getElementById('rotate');
  var btnUndo = document.getElementById('undo');
  var btnSnd = document.getElementById('snd');

  /* ---------- 状态 ---------- */
  var W = 0, H = 0, DPR = 1;
  var R = 7, C = 7;
  var pieces = [];     // {cells:[尾..头], dir, color, alive}
  var grid = [];
  var history = [], moves = 0;
  var levelNo = 1, diff = 1, soundOn = true;
  var flying = [];     // {p, trail, S, t0, dur}
  var shakeId = -1, shakeT0 = 0;
  var blockHi = null;
  var hintId = -1, hintT0 = 0;
  var won = false;
  var cell = 40, ox = 0, oy = 0;
  var confetti = [];

  /* ---------- 工具 ---------- */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function hex2rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function shade(h, t) {
    var c = hex2rgb(h), r, g, b;
    if (t > 0) { r = c[0] * (1 - t); g = c[1] * (1 - t); b = c[2] * (1 - t); }
    else { r = c[0] + (255 - c[0]) * -t; g = c[1] + (255 - c[1]) * -t; b = c[2] + (255 - c[2]) * -t; }
    return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
  }
  function inb(r, c) { return r >= 0 && r < R && c >= 0 && c < C; }
  function headOf(p) { return p.cells[p.cells.length - 1]; }

  /* ---------- 核心规则 ----------
     蛇形移动：头先走，身体沿头走过的轨迹跟进。
     所以「能否脱出」只取决于：头部正前方那条射线是否全空。 */
  function rayOf(head, dir) {
    var out = [], dr = DIRS[dir][0], dc = DIRS[dir][1];
    var r = ((head / C) | 0) + dr, c = (head % C) + dc;
    while (inb(r, c)) { out.push(r * C + c); r += dr; c += dc; }
    return out;
  }
  function escapeInfo(p, g) {
    var ray = rayOf(headOf(p), p.dir), self = {}, i;
    for (i = 0; i < p.cells.length; i++) self[p.cells[i]] = 1;
    for (i = 0; i < ray.length; i++) {
      if (self[ray[i]]) return { ok: false, ray: ray, blocker: ray[i] };
      if (g[ray[i]] !== -1) return { ok: false, ray: ray, blocker: ray[i] };
    }
    return { ok: true, ray: ray, blocker: -1 };
  }
  function canGo(id) {
    if (id < 0 || id >= pieces.length || !pieces[id].alive) return false;
    return escapeInfo(pieces[id], grid).ok;
  }
  // 蛇身要走完的总步数 = 身长 + 头部到出界还需的格数
  function stepCount(p, rayLen) { return p.cells.length + rayLen; }

  /* ---------- 生成：逆向填充（倒着放，正着点必然可解） ---------- */
  function walk(start, len, g) {
    var cells = [start], seen = {}, cur = start, i;
    seen[start] = 1;
    for (i = 1; i < len; i++) {
      var r0 = (cur / C) | 0, c0 = cur % C, opts = [], d;
      for (d = 0; d < 4; d++) {
        var r = r0 + DIRS[d][0], c = c0 + DIRS[d][1];
        if (!inb(r, c)) continue;
        var idx = r * C + c;
        if (seen[idx] || g[idx] !== -1) continue;
        var touch = false;
        for (var s in seen) {
          var si = +s;
          if (si === cur) continue;
          if (Math.abs(((si / C) | 0) - r) + Math.abs((si % C) - c) === 1) { touch = true; break; }
        }
        if (touch) continue;
        opts.push(idx);
      }
      if (!opts.length) return null;
      cur = opts[(Math.random() * opts.length) | 0];
      cells.push(cur); seen[cur] = 1;
    }
    return cells;
  }
  function dirBetween(from, to) {
    var dr = ((to / C) | 0) - ((from / C) | 0), dc = (to % C) - (from % C), d;
    for (d = 0; d < 4; d++) if (DIRS[d][0] === dr && DIRS[d][1] === dc) return d;
    return -1;
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0, t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function put(g, ps, hot, placed) {
    var id = ps.length, j;
    for (j = 0; j < placed.cells.length; j++) g[placed.cells[j]] = id;
    var ray = rayOf(headOf(placed), placed.dir);
    for (j = 0; j < ray.length; j++) hot[ray[j]]++;
    ps.push({ cells: placed.cells, dir: placed.dir });
  }
  // 从 head 沿 dir 到边界是否全空
  function rayFree(head, dir, g) {
    var dr = DIRS[dir][0], dc = DIRS[dir][1];
    var r = ((head / C) | 0) + dr, c = (head % C) + dc;
    while (inb(r, c)) { if (g[r * C + c] !== -1) return false; r += dr; c += dc; }
    return true;
  }
  // 把一条路径变成「尾→头」的线，箭头方向 = 头部那一节的延伸方向
  function orient(path, g) {
    var n = path.length, cands = [], d, k;
    if (n === 1) {
      for (d = 0; d < 4; d++) cands.push({ cells: path.slice(), dir: d });
    } else {
      cands.push({ cells: path.slice(), dir: dirBetween(path[n - 2], path[n - 1]) });
      cands.push({ cells: path.slice().reverse(), dir: dirBetween(path[1], path[0]) });
    }
    var ok = [];
    for (k = 0; k < cands.length; k++) {
      if (cands[k].dir < 0) continue;
      if (escapeInfo(cands[k], g).ok) ok.push(cands[k]);
    }
    if (!ok.length) return null;
    return ok[(Math.random() * ok.length) | 0];
  }
  function build(L) {
    var g = new Array(R * C), hot = new Array(R * C), i, j;
    for (i = 0; i < g.length; i++) { g[i] = -1; hot[i] = 0; }
    var ps = [], filled = 0, target = Math.round(R * C * L.cover), guard = 0;
    // 扫描式填充：每轮遍历剩余空格（按 hot 加权随机排序）逐个尝试，长度不够就逐级缩短到 1
    while (filled < target && guard++ < 60) {
      var empties = [], k;
      for (k = 0; k < R * C; k++) if (g[k] === -1) empties.push(k);
      if (!empties.length) break;
      empties.sort(function (a, b) {
        return (1 + hot[b] * 3) * Math.random() - (1 + hot[a] * 3) * Math.random();
      });
      var placedAny = false;
      for (var e = 0; e < empties.length; e++) {
        var start = empties[e];
        if (g[start] !== -1 || filled >= target) continue;
        var want = L.minLen + ((Math.random() * (L.maxLen - L.minLen + 1)) | 0);
        for (var len = want; len >= 1; len--) {
          var path = walk(start, len, g);
          if (!path) continue;
          var pl = orient(path, g);
          if (!pl) continue;
          var id = ps.length;
          for (j = 0; j < pl.cells.length; j++) g[pl.cells[j]] = id;
          var ray = rayOf(headOf(pl), pl.dir);
          for (j = 0; j < ray.length; j++) hot[ray[j]]++;
          ps.push({ cells: pl.cells, dir: pl.dir });
          filled += pl.cells.length;
          placedAny = true;
          break;
        }
      }
      if (!placedAny) break;
    }
    fillRest(L, g, ps, hot);
    return ps;
  }
  /* 收尾填充：主循环留下的零碎空格，用 1 格或 2 格的小线尽量补满。
     这些线是最后放置的 = 开局最先被点掉的那批，所以它们天然互相形成依赖链。
     约束同主循环：放置时头部射线必须为空（逆向填充保证正着点必然可解）。 */
  function fillRest(L, g, ps, hot) {
    var skip = {};                                  // 命中 hole 的格子永久留白
    for (var round = 0; round < 6; round++) {
      var empties = [], k, d;
      for (k = 0; k < R * C; k++) if (g[k] === -1 && !skip[k]) empties.push(k);
      if (!empties.length) return;
      /* 最受限优先：可选方向越少，越要趁现在放。
         射线只会越填越堵，晚放的格子会永远失去通路。 */
      var scored = [];
      for (k = 0; k < empties.length; k++) {
        var n = 0;
        for (d = 0; d < 4; d++) if (rayFree(empties[k], d, g)) n++;
        scored.push({ a: empties[k], n: n, r: Math.random() });
      }
      scored.sort(function (x, y) { return (x.n - y.n) || (x.r - y.r); });
      var improved = false;
      for (k = 0; k < scored.length; k++) {
        var a = scored[k].a;
        if (g[a] !== -1) continue;
        if (Math.random() < L.hole) { skip[a] = 1; continue; }
        var placed = null;
        if (Math.random() < L.pair) {
          var nb = [];
          for (d = 0; d < 4; d++) {
            var r = ((a / C) | 0) + DIRS[d][0], c = (a % C) + DIRS[d][1];
            if (!inb(r, c)) continue;
            if (g[r * C + c] === -1 && !skip[r * C + c]) nb.push(r * C + c);
          }
          shuffle(nb);
          for (var q = 0; q < nb.length && !placed; q++) placed = orient([a, nb[q]], g);
        }
        if (!placed) placed = orient([a], g);   // 退化为单格线
        if (!placed) continue;                      // 四面射线都被占：这个洞填不了，留空
        put(g, ps, hot, placed);
        improved = true;
      }
      if (!improved) return;
    }
  }
  // 纠缠度：依赖越深、开局能直接飞出的越少越好
  function scoreOf(ps) {
    var g = new Array(R * C), i, j;
    for (i = 0; i < g.length; i++) g[i] = -1;
    for (i = 0; i < ps.length; i++) for (j = 0; j < ps[i].cells.length; j++) g[ps[i].cells[j]] = i;
    var memo = {}, stack = {};
    function blockerIds(p) {
      var info = escapeInfo(p, g), hit = {}, out = [], k;
      for (k = 0; k < info.ray.length; k++) {
        var o = g[info.ray[k]];
        if (o !== -1 && !hit[o]) { hit[o] = 1; out.push(o); }
      }
      return out;
    }
    function depth(k) {
      if (memo[k] !== undefined) return memo[k];
      if (stack[k]) return 0;
      stack[k] = 1;
      var bs = blockerIds(ps[k]), m = 0, b;
      for (b = 0; b < bs.length; b++) m = Math.max(m, 1 + depth(bs[b]));
      stack[k] = 0; memo[k] = m;
      return m;
    }
    var free = 0, maxD = 0, sumD = 0, cells = 0;
    for (i = 0; i < ps.length; i++) {
      var d = depth(i);
      if (d === 0) free++;
      if (d > maxD) maxD = d;
      sumD += d;
      cells += ps[i].cells.length;

  /* ---------- 彩带 ---------- */

        y: H * 0.3 + (Math.random() - 0.5) * 40,
        vx: (Math.random() - 0.5) * 0.34,
        vy: -0.16 - Math.random() * 0.34,

    SFX.done();
    elMt.textContent = '全部脱出';
    elMp.textContent = '第 ' + levelNo + ' 关 · ' + moves + ' 步';
    setTimeout(function () { elMask.classList.add('show'); }, 420);
    save();
  }

  /* ---------- 交互 ---------- */
  function hit(x, y) {
    var c = Math.floor((x - ox) / cell), r = Math.floor((y - oy) / cell);
    if (!inb(r, c)) return -1;
    return grid[r * C + c];
  }
  function onTap(ev) {
    ac();
    if (won) return;
    var rect = cv.getBoundingClientRect();
    var id = hit(ev.clientX - rect.left, ev.clientY - rect.top);
    if (id < 0) return;
    if (canGo(id)) {
      launch(id);
    } else {
      shakeId = id; shakeT0 = performance.now();
      var info = escapeInfo(pieces[id], grid);
      blockHi = {
        id: (info.blocker >= 0 ? grid[info.blocker] : -1),
        cell: info.blocker,
        t0: performance.now()
      };
      SFX.bad();
    }
  }
  cv.addEventListener('pointerdown', function (e) { e.preventDefault(); onTap(e); }, { passive: false });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ---------- hud ---------- */
  function syncHud() {
    elLeft.textContent = aliveCount();
    elMv.textContent = moves;
    btnUndo.disabled = !history.length || won;
    var L = LEVELS[diff];
    elSub.textContent = '第 ' + levelNo + ' 关 · ' + L.name + ' ' + L.R + '×' + L.C;
  }
  function syncChips() {
    var bs = document.querySelectorAll('#chips button');
    for (var i = 0; i < bs.length; i++) {
      bs[i].classList.toggle('on', parseInt(bs[i].getAttribute('data-i'), 10) === diff);
    }
  }

  /* ---------- 事件 ---------- */
  document.getElementById('chips').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    ac(); newGame(parseInt(b.getAttribute('data-i'), 10));
  });
  btnUndo.addEventListener('click', function () { ac(); undo(); });
  document.getElementById('hint').addEventListener('click', function () { ac(); hint(); });
  document.getElementById('reset').addEventListener('click', function () { ac(); reset(); });
  document.getElementById('new').addEventListener('click', function () { ac(); levelNo++; newGame(); });
  document.getElementById('again').addEventListener('click', function () { ac(); reset(); });
  document.getElementById('next').addEventListener('click', function () { ac(); levelNo++; newGame(); });
  btnSnd.addEventListener('click', function () {
    ac();
    soundOn = !soundOn;
    btnSnd.textContent = soundOn ? '♪' : '✕';
    btnSnd.style.color = soundOn ? '#9fb0c8' : '#5b6b82';
    if (soundOn) SFX.pick();
    save();
  });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 220); });

  /* ---------- 主循环 ---------- */
  function frame() {
    var now = performance.now();
    for (var i = flying.length - 1; i >= 0; i--) {
      if (now - flying[i].t0 >= flying[i].dur) flying.splice(i, 1);
    }
    if (!won && !flying.length && aliveCount() === 0) win();
    draw(now);
    requestAnimationFrame(frame);
  }

  /* ---------- 启动 ---------- */
  btnSnd.textContent = soundOn ? '♪' : '✕';
  if (!load()) newGame(1);
  else {
    syncChips(); syncHud();
    if (!aliveCount()) reset();
  }
  resize();
  requestAnimationFrame(frame);

  window.__arrow = {
    get pieces() { return pieces; }, get grid() { return grid; },
    get R() { return R; }, get C() { return C; },
    get moves() { return moves; }, get won() { return won; },
    get alive() { return aliveCount(); }, get flying() { return flying.length; },
    get cell() { return cell; }, get ox() { return ox; }, get oy() { return oy; },
    canGo: canGo, launch: launch, undo: undo, reset: reset, hint: hint,
    newGame: newGame, tap: onTap, resize: resize, sample: sample,
    rayOf: rayOf, escapeInfo: escapeInfo, buildTrail: buildTrail,
    solve: function () {
      var snap = pieces.map(function (p) { return p.alive; });
      var g2 = grid.slice();
      var seq = [], guard = 0;
      while (guard++ < 3000) {
        var any = -1;
        for (var i = 0; i < pieces.length; i++) {
          if (pieces[i].alive && escapeInfo(pieces[i], grid).ok) { any = i; break; }
        }
        if (any < 0) break;
        for (var j = 0; j < pieces[any].cells.length; j++) grid[pieces[any].cells[j]] = -1;
        pieces[any].alive = false;
        seq.push(any);
      }
      var cleared = aliveCount() === 0;
      for (var k = 0; k < pieces.length; k++) pieces[k].alive = snap[k];
      grid = g2;
      return { seq: seq, cleared: cleared };
    }
  };
})();
</script>
</body>
</html>
