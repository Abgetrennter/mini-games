<script>
(function () {
  'use strict';

  /* ---------- 常量 ---------- */
  var DIRS = [[-1, 0], [0, 1], [1, 0], [0, -1]];  // 0上 1右 2下 3左
  var ANG = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
  var PAL = ['#38bdf8', '#fbbf24', '#a78bfa', '#fb7185', '#34d399', '#f472b6', '#60a5fa', '#facc15'];
  var LEVELS = [
    { name: '简单', R: 6, C: 6, cover: 0.60, minLen: 1, maxLen: 2, tries: 8 },
    { name: '普通', R: 7, C: 7, cover: 0.66, minLen: 2, maxLen: 3, tries: 10 },
    { name: '困难', R: 8, C: 8, cover: 0.70, minLen: 2, maxLen: 4, tries: 14 },
    { name: '地狱', R: 9, C: 9, cover: 0.72, minLen: 2, maxLen: 5, tries: 14 }
  ];
  var KEY = 'arrowlines.v1';

  /* ---------- dom ---------- */
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var wrap = document.getElementById('wrap');
  var elLeft = document.getElementById('left');
  var elMv = document.getElementById('mv');
  var elSub = document.getElementById('sub');
  var elMask = document.getElementById('mask');
  var elMt = document.getElementById('mt');
  var elMp = document.getElementById('mp');
  var elRotate = document.getElementById('rotate');
  var btnUndo = document.getElementById('undo');
  var btnSnd = document.getElementById('snd');

  /* ---------- 状态 ---------- */
  var W = 0, H = 0, DPR = 1;
  var R = 7, C = 7;
  var pieces = [];        // {cells:[], dir, color, alive}
  var grid = [];          // pieceId | -1
  var history = [], moves = 0;
  var levelNo = 1, diff = 1, soundOn = true;
  var flying = [];        // {p, t0, dur, dist, ux, uy}
  var shakeId = -1, shakeT0 = 0;
  var blockHi = null;     // {id, t0}
  var hintId = -1, hintT0 = 0;
  var won = false;
  var cell = 40, ox = 0, oy = 0;
  var confetti = [];

  /* ---------- 工具 ---------- */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function easeOut(p) { return 1 - Math.pow(1 - p, 3); }
  function hex2rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function shade(h, t) {
    var c = hex2rgb(h), r, g, b;
    if (t > 0) { r = c[0] * (1 - t); g = c[1] * (1 - t); b = c[2] * (1 - t); }
    else { r = c[0] + (255 - c[0]) * -t; g = c[1] + (255 - c[1]) * -t; b = c[2] + (255 - c[2]) * -t; }
    return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
  }
  function inb(r, c) { return r >= 0 && r < R && c >= 0 && c < C; }

  /* ---------- 核心规则：整条线沿 dir 平移，直到完全出界 ---------- */
  function slideInfo(cells, dir, g) {
    var self = {}, i;
    for (i = 0; i < cells.length; i++) self[cells[i]] = 1;
    var dr = DIRS[dir][0], dc = DIRS[dir][1];
    var cur = cells, steps = 0, sweep = [];
    for (var guard = 0; guard < 400; guard++) {
      var moved = [], out = 0, j, r, c;
      for (j = 0; j < cur.length; j++) {
        r = ((cur[j] / C) | 0) + dr; c = (cur[j] % C) + dc;
        if (!inb(r, c)) { out++; continue; }
        moved.push(r * C + c);
      }
      if (out === cur.length) return { ok: true, steps: steps + 1, blocker: -1, sweep: sweep };
      steps++;
      for (j = 0; j < moved.length; j++) {
        var m = moved[j];
        sweep.push(m);
        if (self[m]) continue;
        if (g[m] !== -1) return { ok: false, steps: steps, blocker: m, sweep: sweep };
      }
      cur = moved;
    }
    return { ok: false, steps: steps, blocker: -1, sweep: sweep };
  }
  function canGo(id) {
    if (id < 0 || id >= pieces.length || !pieces[id].alive) return false;
    return slideInfo(pieces[id].cells, pieces[id].dir, grid).ok;
  }

  /* ---------- 生成：逆向填充（倒着放，正着点必然可解） ---------- */
  function walk(start, len, g) {
    var cells = [start], seen = {}, cur = start;
    seen[start] = 1;
    for (var i = 1; i < len; i++) {
      var r0 = (cur / C) | 0, c0 = cur % C, opts = [];
      for (var d = 0; d < 4; d++) {
        var r = r0 + DIRS[d][0], c = c0 + DIRS[d][1];
        if (!inb(r, c)) continue;
        var idx = r * C + c;
        if (seen[idx] || g[idx] !== -1) continue;
        opts.push(idx);
      }
      if (!opts.length) return null;
      cur = opts[(Math.random() * opts.length) | 0];
      cells.push(cur); seen[cur] = 1;
    }
    return cells;
  }
  function build(Rn, Cn, cover, minLen, maxLen) {
    var g = new Array(Rn * Cn), i;
    for (i = 0; i < g.length; i++) g[i] = -1;
    var ps = [], filled = 0, target = Math.round(Rn * Cn * cover), tries = 0;
    while (filled < target && tries < 2600) {
      tries++;
      var start = (Math.random() * Rn * Cn) | 0;
      if (g[start] !== -1) continue;
      var len = minLen + ((Math.random() * (maxLen - minLen + 1)) | 0);
      var cells = walk(start, len, g);
      if (!cells) continue;
      var dir = (Math.random() * 4) | 0;
      if (!slideInfo(cells, dir, g).ok) continue;
      var id = ps.length;
      for (i = 0; i < cells.length; i++) g[cells[i]] = id;
      ps.push({ cells: cells, dir: dir });
      filled += cells.length;
    }
    return ps;
  }
  // 纠缠度评分：依赖越深、开局自由越少越好
  function scoreOf(ps, Rn, Cn) {
    var g = new Array(Rn * Cn), i, j;
    for (i = 0; i < g.length; i++) g[i] = -1;
    for (i = 0; i < ps.length; i++) for (j = 0; j < ps[i].cells.length; j++) g[ps[i].cells[j]] = i;
    var memo = {}, stack = {};
    function hitIds(p) {
      var info = slideInfo(p.cells, p.dir, g), hit = {}, out = [];
      for (var k = 0; k < info.sweep.length; k++) {
        var o = g[info.sweep[k]];
        if (o !== -1 && !hit[o]) { hit[o] = 1; out.push(o); }
      }
      return out;
    }
    function depth(i2) {
      if (memo[i2] !== undefined) return memo[i2];
      if (stack[i2]) return 0;
      stack[i2] = 1;
      var bs = hitIds(ps[i2]), m = 0;
      for (var k = 0; k < bs.length; k++) m = Math.max(m, 1 + depth(bs[k]));
      stack[i2] = 0;
      memo[i2] = m;
      return m;
    }
    var free = 0, maxD = 0, sumD = 0;
    for (i = 0; i < ps.length; i++) {
      var d = depth(i);
      if (d === 0) free++;
      if (d > maxD) maxD = d;
      sumD += d;
    }
    return (ps.length ? sumD / ps.length : 0) + 0.32 * maxD - 0.06 * free;
  }
  function generate(L) {
    var best = null, bestS = -1e9;
    for (var t = 0; t < L.tries; t++) {
      var ps = build(L.R, L.C, L.cover, L.minLen, L.maxLen);
      if (!ps.length) continue;
      var s = scoreOf(ps, L.R, L.C);
      if (s > bestS) { bestS = s; best = ps; }
    }
    if (!best) best = build(L.R, L.C, L.cover, L.minLen, L.maxLen);
    colorize(best, L.R, L.C);
    return best;
  }
  function colorize(ps, Rn, Cn) {
    var occ = new Array(Rn * Cn), i, j, d;
    for (i = 0; i < occ.length; i++) occ[i] = -1;
    for (i = 0; i < ps.length; i++) for (j = 0; j < ps[i].cells.length; j++) occ[ps[i].cells[j]] = i;
    for (i = 0; i < ps.length; i++) {
      var used = {};
      for (j = 0; j < ps[i].cells.length; j++) {
        var r = (ps[i].cells[j] / Cn) | 0, c = ps[i].cells[j] % Cn;
        for (d = 0; d < 4; d++) {
          var r2 = r + DIRS[d][0], c2 = c + DIRS[d][1];
          if (r2 < 0 || r2 >= Rn || c2 < 0 || c2 >= Cn) continue;
          var nb = occ[r2 * Cn + c2];
          if (nb >= 0 && nb !== i && ps[nb].color !== undefined) used[ps[nb].color] = 1;
        }
      }
      var pick = 0;
      for (var k = 0; k < PAL.length; k++) {
        var ci = (i + k) % PAL.length;
        if (!used[ci]) { pick = ci; break; }
      }
      ps[i].color = pick;
    }
  }
  function rebuildGrid() {
    var i, j;
    grid = new Array(R * C);
    for (i = 0; i < grid.length; i++) grid[i] = -1;
    for (i = 0; i < pieces.length; i++) {
      if (!pieces[i].alive) continue;
      for (j = 0; j < pieces[i].cells.length; j++) grid[pieces[i].cells[j]] = i;
    }
  }
  function aliveCount() {
    var n = 0;
    for (var i = 0; i < pieces.length; i++) if (pieces[i].alive) n++;
    return n;
  }

  /* ---------- 存档 ---------- */
  function save() {
    try {
      var ps = [], i;
      for (i = 0; i < pieces.length; i++) {
        ps.push({ c: pieces[i].cells, d: pieces[i].dir, a: pieces[i].alive ? 1 : 0, k: pieces[i].color });
      }
      localStorage.setItem(KEY, JSON.stringify({
        v: 1, R: R, C: C, p: ps, h: history, m: moves, df: diff, lv: levelNo, s: soundOn ? 1 : 0
      }));
    } catch (e) {}
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (!s || s.v !== 1 || !Array.isArray(s.p)) return false;
      if (typeof s.R !== 'number' || typeof s.C !== 'number' || s.R < 3 || s.C < 3 || s.R > 16 || s.C > 16) return false;
      var ps = [], i, j;
      for (i = 0; i < s.p.length; i++) {
        var it = s.p[i];
        if (!it || !Array.isArray(it.c) || !it.c.length) return false;
        for (j = 0; j < it.c.length; j++) {
          var v = it.c[j];
          if (typeof v !== 'number' || v < 0 || v >= s.R * s.C) return false;
        }
        if (!(it.d >= 0 && it.d < 4)) return false;
        ps.push({
          cells: it.c.slice(), dir: it.d,
          color: (typeof it.k === 'number' ? it.k : i) % PAL.length,
          alive: it.a === 1
        });
      }
      R = s.R; C = s.C; pieces = ps;
      history = Array.isArray(s.h) ? s.h.filter(function (x) {
        return typeof x === 'number' && x >= 0 && x < pieces.length;
      }) : [];
      moves = s.m || 0;
      diff = (typeof s.df === 'number' && s.df >= 0 && s.df < LEVELS.length) ? s.df : 1;
      levelNo = s.lv || 1;
      if (typeof s.s === 'number') soundOn = s.s === 1;
      rebuildGrid();
      return true;
    } catch (e) { return false; }
  }

  /* ---------- 布局 ---------- */
  function layout() {
    var pad = 12;
    cell = Math.min((W - pad * 2) / C, (H - pad * 2) / R);
    cell = clamp(cell, 20, 74);
    ox = (W - cell * C) / 2;
    oy = (H - cell * R) / 2;
  }
  function resize() {
    W = wrap.clientWidth || window.innerWidth;
    H = wrap.clientHeight || Math.round(window.innerHeight * 0.55);
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = Math.max(1, Math.round(W * DPR));
    cv.height = Math.max(1, Math.round(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
    elRotate.style.display = (window.innerWidth > window.innerHeight && window.innerWidth > 560) ? 'flex' : 'none';
  }

  /* ---------- 绘制 ---------- */
  function rr(g, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y);
    g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r);
    g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r);
    g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
  }
  function arrowPath(g, s) {
    var hw = s * 0.30, hw2 = s * 0.115, top = -s * 0.34, mid = s * 0.02, bot = s * 0.32;
    g.beginPath();
    g.moveTo(0, top);
    g.lineTo(hw, mid);
    g.lineTo(hw2, mid);
    g.lineTo(hw2, bot);
    g.lineTo(-hw2, bot);
    g.lineTo(-hw2, mid);
    g.lineTo(-hw, mid);
    g.closePath();
  }
  function cx(i) { return ox + (i % C) * cell + cell / 2; }
  function cy(i) { return oy + ((i / C) | 0) * cell + cell / 2; }
  // 前缘格子：沿 dir 方向的邻格不属于本 piece
  function frontCells(p) {
    var set = {}, i;
    for (i = 0; i < p.cells.length; i++) set[p.cells[i]] = 1;
    var dr = DIRS[p.dir][0], dc = DIRS[p.dir][1], out = [];
    for (i = 0; i < p.cells.length; i++) {
      var r = ((p.cells[i] / C) | 0) + dr, c = (p.cells[i] % C) + dc;
      if (!inb(r, c) || !set[r * C + c]) out.push(p.cells[i]);
    }
    return out;
  }
  // 相邻格子之间的接缝补丁（只处理右/下，避免重复）
  function seams(g, p, set) {
    var i, d, s = cell * 0.9, half = s / 2, w = cell * 0.18;
    for (i = 0; i < p.cells.length; i++) {
      var x = cx(p.cells[i]), y = cy(p.cells[i]);
      for (d = 0; d < 4; d++) {
        var nb = p.cells[i] + DIRS[d][0] * C + DIRS[d][1];
        if (!set[nb]) continue;
        if (d === 1) g.fillRect(x + cell * 0.5 - w / 2, y - half, w, s);
        else if (d === 2) g.fillRect(x - half, y + cell * 0.5 - w / 2, s, w);
      }
    }
  }
  function paintPiece(g, p, opt) {
    opt = opt || {};
    var col = PAL[p.color % PAL.length];
    var s = cell * 0.9, half = s / 2, i, x, y;
    var top = 1e9, bot = -1e9, set = {};
    for (i = 0; i < p.cells.length; i++) {
      set[p.cells[i]] = 1;
      y = cy(p.cells[i]);
      if (y < top) top = y;
      if (y > bot) bot = y;
    }
    var grd = g.createLinearGradient(0, top - half, 0, bot + half);
    grd.addColorStop(0, shade(col, -0.30));
    grd.addColorStop(0.55, col);
    grd.addColorStop(1, shade(col, 0.30));
    var baseAlpha = (opt.alpha !== undefined) ? opt.alpha : 1;

    g.save();
    if (opt.dx || opt.dy) g.translate(opt.dx || 0, opt.dy || 0);
    g.globalAlpha = baseAlpha;

    // 阴影
    g.save();
    g.translate(0, Math.max(1.5, cell * 0.055));
    g.fillStyle = 'rgba(0,0,0,0.30)';
    for (i = 0; i < p.cells.length; i++) {
      rr(g, cx(p.cells[i]) - half, cy(p.cells[i]) - half, s, s, s * 0.28);
      g.fill();
    }
    seams(g, p, set);
    g.restore();

    // 本体
    g.fillStyle = grd;
    seams(g, p, set);
    for (i = 0; i < p.cells.length; i++) {
      rr(g, cx(p.cells[i]) - half, cy(p.cells[i]) - half, s, s, s * 0.28);
      g.fill();
    }
    // 顶部高光
    g.save();
    g.globalAlpha = baseAlpha * 0.26;
    g.fillStyle = '#ffffff';
    for (i = 0; i < p.cells.length; i++) {
      x = cx(p.cells[i]); y = cy(p.cells[i]);
      g.fillRect(x - half * 0.70, y - half * 0.80, s * 0.70, Math.max(1.5, s * 0.12));
    }
    g.restore();

    // 前缘箭头
    var fr = frontCells(p);
    g.fillStyle = 'rgba(255,255,255,0.92)';
    for (i = 0; i < fr.length; i++) {
      g.save();
      g.translate(cx(fr[i]), cy(fr[i]));
      g.rotate(ANG[p.dir]);
      arrowPath(g, s * 0.86);
      g.fill();
      g.restore();
    }
    g.restore();
  }
  function fillCells(g, list, color, pad) {
    g.save();
    g.fillStyle = color;
    for (var i = 0; i < list.length; i++) {
      var s = cell * (1 - (pad || 0.1));
      rr(g, cx(list[i]) - s / 2, cy(list[i]) - s / 2, s, s, s * 0.26);
      g.fill();
    }
    g.restore();
  }

  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    var bw = cell * C, bh = cell * R, pad = Math.max(5, cell * 0.12), i;

    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.028)';
    rr(ctx, ox - pad, oy - pad, bw + pad * 2, bh + pad * 2, cell * 0.22);
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.045)';
    ctx.lineWidth = 1;
    for (i = 1; i < C; i++) {
      ctx.beginPath();
      ctx.moveTo(Math.round(ox + i * cell) + .5, oy);
      ctx.lineTo(Math.round(ox + i * cell) + .5, oy + bh);
      ctx.stroke();
    }
    for (i = 1; i < R; i++) {
      ctx.beginPath();
      ctx.moveTo(ox, Math.round(oy + i * cell) + .5);
      ctx.lineTo(ox + bw, Math.round(oy + i * cell) + .5);
      ctx.stroke();
    }
    ctx.restore();

    // 提示：扫掠区域 + 脉冲框
    if (hintId >= 0 && pieces[hintId] && pieces[hintId].alive && now - hintT0 < 2800) {
      var hp = ((now - hintT0) % 950) / 950;
      var info = slideInfo(pieces[hintId].cells, pieces[hintId].dir, grid);
      ctx.save();
      ctx.globalAlpha = (1 - hp) * 0.20;
      fillCells(ctx, info.sweep, '#fde68a', 0.06);
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = (1 - hp) * 0.75;
      ctx.strokeStyle = '#fde68a';
      ctx.lineWidth = 2.5;
      var fr = frontCells(pieces[hintId]);
      for (i = 0; i < fr.length; i++) {
        rr(ctx, cx(fr[i]) - cell * (0.45 + hp * 0.14), cy(fr[i]) - cell * (0.45 + hp * 0.14),
          cell * (0.9 + hp * 0.28), cell * (0.9 + hp * 0.28), cell * 0.3);
        ctx.stroke();
      }
      ctx.restore();
    } else if (hintId >= 0) hintId = -1;

    // 阻挡者闪烁
    if (blockHi && blockHi.id >= 0 && pieces[blockHi.id] && pieces[blockHi.id].alive && now - blockHi.t0 < 820) {
      var bp = (now - blockHi.t0) / 820;
      var blink = 0.5 + 0.5 * Math.sin((now - blockHi.t0) / 820 * Math.PI * 5);
      ctx.save();
      ctx.globalAlpha = (1 - bp) * blink * 0.85;
      ctx.strokeStyle = '#f87171';
      ctx.lineWidth = 3;
      var bc = pieces[blockHi.id].cells;
      for (i = 0; i < bc.length; i++) {
        rr(ctx, cx(bc[i]) - cell * 0.46, cy(bc[i]) - cell * 0.46, cell * 0.92, cell * 0.92, cell * 0.3);
        ctx.stroke();
      }
      ctx.restore();
    } else if (blockHi) blockHi = null;

    // 静态
    for (i = 0; i < pieces.length; i++) {
      if (!pieces[i].alive) continue;
      var o = {};
      if (i === shakeId && now - shakeT0 < 400) {
        var sp = (now - shakeT0) / 400;
        o.dx = Math.sin((now - shakeT0) / 400 * Math.PI * 6) * cell * 0.10 * (1 - sp);
      }
      paintPiece(ctx, pieces[i], o);
    }
    if (shakeId >= 0 && now - shakeT0 >= 400) shakeId = -1;

    // 飞出
    for (i = 0; i < flying.length; i++) {
      var f = flying[i];
      var pf = clamp((now - f.t0) / f.dur, 0, 1);
      var e = easeOut(pf);
      paintPiece(ctx, f.p, {
        dx: f.ux * f.dist * e,
        dy: f.uy * f.dist * e,
        alpha: pf < 0.52 ? 1 : 1 - (pf - 0.52) / 0.48
      });
    }

    drawConfetti(ctx, now);
  }

  /* ---------- 彩带 ---------- */
  function burst() {
    confetti = [];
    for (var i = 0; i < 90; i++) {
      confetti.push({
        x: W / 2 + (Math.random() - 0.5) * W * 0.5,
        y: H * 0.3 + (Math.random() - 0.5) * 40,
        vx: (Math.random() - 0.5) * 0.34,
        vy: -0.16 - Math.random() * 0.34,
        c: PAL[(Math.random() * PAL.length) | 0],
        s: 4 + Math.random() * 5,
        rot: Math.random() * 6.28,
        vr: (Math.random() - 0.5) * 0.3,
        t0: performance.now() + Math.random() * 260
      });
    }
  }
  function drawConfetti(g, now) {
    if (!confetti.length) return;
    var alive = false;
    for (var i = 0; i < confetti.length; i++) {
      var p = confetti[i];
      if (now < p.t0) { alive = true; continue; }
      p.vy += 0.0011 * 16;
      p.x += p.vx * 16;
      p.y += p.vy * 16;
      p.rot += p.vr;
      if (p.y > H + 40) continue;
      alive = true;
      g.save();
      g.translate(p.x, p.y);
      g.rotate(p.rot);
      g.fillStyle = p.c;
      g.globalAlpha = 0.9;
      g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      g.restore();
    }
    if (!alive) confetti = [];
  }

  /* ---------- 音效 ---------- */
  var actx = null;
  function ac() {
    try {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        actx = new AC();
      }
      if (actx.state === 'suspended') actx.resume();
      return actx;
    } catch (e) { return null; }
  }
  function tone(freq, dur, type, vol, slideTo) {
    if (!soundOn) return;
    var a = ac(); if (!a) return;
    try {
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, a.currentTime);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), a.currentTime + dur);
      g.gain.setValueAtTime(0.0001, a.currentTime);
      g.gain.exponentialRampToValueAtTime(vol || 0.14, a.currentTime + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + dur + 0.02);
    } catch (e) {}
  }
  function noise(dur, vol, f0, f1) {
    if (!soundOn) return;
    var a = ac(); if (!a) return;
    try {
      var n = Math.floor(a.sampleRate * dur);
      var buf = a.createBuffer(1, n, a.sampleRate);
      var ch = buf.getChannelData(0);
      for (var i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
      var src = a.createBufferSource();
      src.buffer = buf;
      var bp = a.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(f0, a.currentTime);
      bp.frequency.exponentialRampToValueAtTime(f1, a.currentTime + dur);
      bp.Q.value = 1.2;
      var g = a.createGain();
      g.gain.setValueAtTime(vol || 0.1, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
      src.connect(bp); bp.connect(g); g.connect(a.destination);
      src.start();
    } catch (e) {}
  }
  var SFX = {
    fly: function () { noise(0.22, 0.085, 800, 2400); },
    bad: function () { tone(150, 0.14, 'square', 0.07, 90); },
    pick: function () { tone(680, 0.07, 'sine', 0.07); },
    done: function () {
      [523, 659, 784, 1047].forEach(function (f, i) {
        setTimeout(function () { tone(f, 0.24, 'triangle', 0.11); }, i * 95);
      });
    }
  };

  /* ---------- 操作 ---------- */
  function launch(id) {
    var p = pieces[id];
    var info = slideInfo(p.cells, p.dir, grid);
    var j;
    for (j = 0; j < p.cells.length; j++) grid[p.cells[j]] = -1;
    p.alive = false;
    history.push(id);
    flying.push({
      p: p, t0: performance.now(),
      dur: clamp(200 + info.steps * 38, 240, 520),
      dist: info.steps * cell + cell * 0.6,
      ux: DIRS[p.dir][1], uy: DIRS[p.dir][0]
    });
    moves++;
    hintId = -1; blockHi = null;
    SFX.fly();
    syncHud();
    save();
  }
  function undo() {
    if (won || !history.length) return;
    var id = history.pop();
    if (id < 0 || id >= pieces.length || pieces[id].alive) return;
    var p = pieces[id], j;
    for (j = 0; j < p.cells.length; j++) {
      if (grid[p.cells[j]] !== -1) return;
    }
    for (j = 0; j < p.cells.length; j++) grid[p.cells[j]] = id;
    p.alive = true;
    flying = [];
    hintId = -1; blockHi = null;
    moves = Math.max(0, moves - 1);
    SFX.pick();
    syncHud();
    save();
  }
  function reset() {
    var i;
    for (i = 0; i < pieces.length; i++) pieces[i].alive = true;
    rebuildGrid();
    history = []; moves = 0; won = false;
    flying = []; confetti = []; shakeId = -1; blockHi = null; hintId = -1;
    elMask.classList.remove('show');
    SFX.pick();
    syncHud();
    save();
  }
  function newGame(d) {
    if (typeof d === 'number') diff = d;
    var L = LEVELS[diff];
    R = L.R; C = L.C;
    pieces = generate(L);
    for (var i = 0; i < pieces.length; i++) pieces[i].alive = true;
    rebuildGrid();
    history = []; moves = 0; won = false;
    flying = []; confetti = []; shakeId = -1; blockHi = null; hintId = -1;
    elMask.classList.remove('show');
    syncChips(); syncHud(); resize(); save();
  }
  function hint() {
    if (won) return;
    var avail = [];
    for (var i = 0; i < pieces.length; i++) if (canGo(i)) avail.push(i);
    if (!avail.length) return;
    hintId = avail[(Math.random() * avail.length) | 0];
    hintT0 = performance.now();
    SFX.pick();
  }
  function win() {
    won = true;
    burst();
    SFX.done();
    elMt.textContent = '全部脱出';
    elMp.textContent = '第 ' + levelNo + ' 关 · ' + moves + ' 步';
    setTimeout(function () { elMask.classList.add('show'); }, 420);
    save();
  }

  /* ---------- 交互 ---------- */
  function hit(x, y) {
    var c = Math.floor((x - ox) / cell), r = Math.floor((y - oy) / cell);
    if (!inb(r, c)) return -1;
    return grid[r * C + c];
  }
  function onTap(ev) {
    ac();
    if (won) return;
    var rect = cv.getBoundingClientRect();
    var id = hit(ev.clientX - rect.left, ev.clientY - rect.top);
    if (id < 0) return;
    if (canGo(id)) {
      launch(id);
    } else {
      shakeId = id; shakeT0 = performance.now();
      var info = slideInfo(pieces[id].cells, pieces[id].dir, grid);
      blockHi = { id: (info.blocker >= 0 ? grid[info.blocker] : -1), t0: performance.now() };
      SFX.bad();
    }
  }
  cv.addEventListener('pointerdown', function (e) { e.preventDefault(); onTap(e); }, { passive: false });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ---------- hud ---------- */
  function syncHud() {
    elLeft.textContent = aliveCount();
    elMv.textContent = moves;
    btnUndo.disabled = !history.length || won;
    var L = LEVELS[diff];
    elSub.textContent = '第 ' + levelNo + ' 关 · ' + L.name + ' ' + L.R + '×' + L.C;
  }
  function syncChips() {
    var bs = document.querySelectorAll('#chips button');
    for (var i = 0; i < bs.length; i++) {
      bs[i].classList.toggle('on', parseInt(bs[i].getAttribute('data-i'), 10) === diff);
    }
  }

  /* ---------- 事件 ---------- */
  document.getElementById('chips').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    ac(); newGame(parseInt(b.getAttribute('data-i'), 10));
  });
  btnUndo.addEventListener('click', function () { ac(); undo(); });
  document.getElementById('hint').addEventListener('click', function () { ac(); hint(); });
  document.getElementById('reset').addEventListener('click', function () { ac(); reset(); });
  document.getElementById('new').addEventListener('click', function () { ac(); levelNo++; newGame(); });
  document.getElementById('again').addEventListener('click', function () { ac(); reset(); });
  document.getElementById('next').addEventListener('click', function () { ac(); levelNo++; newGame(); });
  btnSnd.addEventListener('click', function () {
    ac();
    soundOn = !soundOn;
    btnSnd.textContent = soundOn ? '♪' : '✕';
    btnSnd.style.color = soundOn ? '#9fb0c8' : '#5b6b82';
    if (soundOn) SFX.pick();
    save();
  });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 220); });

  /* ---------- 主循环 ---------- */
  function frame() {
    var now = performance.now();
    for (var i = flying.length - 1; i >= 0; i--) {
      if (now - flying[i].t0 >= flying[i].dur) flying.splice(i, 1);
    }
    if (!won && !flying.length && aliveCount() === 0) win();
    draw(now);
    requestAnimationFrame(frame);
  }

  /* ---------- 启动 ---------- */
  btnSnd.textContent = soundOn ? '♪' : '✕';
  if (!load()) newGame(1);
  else {
    syncChips(); syncHud();
    if (!aliveCount()) reset();
  }
  resize();
  requestAnimationFrame(frame);

  window.__arrow = {
    get pieces() { return pieces; }, get grid() { return grid; },
    get R() { return R; }, get C() { return C; },
    get moves() { return moves; }, get won() { return won; },
    get alive() { return aliveCount(); },
    canGo: canGo, launch: launch, undo: undo, reset: reset, hint: hint,
    newGame: newGame, tap: onTap, resize: resize,
    solve: function () {
      var snap = pieces.map(function (p) { return p.alive; });
      var g2 = grid.slice();
      var seq = [], guard = 0;
      while (guard++ < 3000) {
        var any = -1;
        for (var i = 0; i < pieces.length; i++) {
          if (pieces[i].alive && slideInfo(pieces[i].cells, pieces[i].dir, grid).ok) { any = i; break; }
        }
        if (any < 0) break;
        for (var j = 0; j < pieces[any].cells.length; j++) grid[pieces[any].cells[j]] = -1;
        pieces[any].alive = false;
        seq.push(any);
      }
      var cleared = aliveCount() === 0;
      for (var k = 0; k < pieces.length; k++) pieces[k].alive = snap[k];
      grid = g2;
      return { seq: seq, cleared: cleared };
    }
  };
})();
</script>
</body>
