<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="围堵毛贼">
<meta name="theme-color" content="#EDE9E3">
<title>围堵毛贼</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#EDE9E3}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    color:#4A4741;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    overscroll-behavior:none;
    touch-action:manipulation;
  }
  #app{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background:radial-gradient(120% 80% at 50% 0%,#FAF7F2 0%,#E4DFD7 62%);
  }
  header{flex:0 0 auto;padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .title{font-size:17px;font-weight:600;letter-spacing:1px}
  .title small{display:block;font-size:11px;font-weight:400;color:#9C948A;letter-spacing:0;margin-top:2px}
  .right{display:flex;align-items:center;gap:12px}
  .stats{display:flex;align-items:center;gap:14px}
  .stat{text-align:right;line-height:1.1}
  .stat b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
  .stat span{display:block;font-size:10px;color:#9C948A;margin-top:1px}
  .sndbtn{
    width:34px;height:34px;flex:0 0 auto;border-radius:50%;font-size:15px;line-height:1;
    font-family:inherit;color:#7B746B;background:rgba(255,255,255,.62);
    border:1px solid rgba(74,71,65,.14);cursor:pointer;transition:.15s;
  }
  .sndbtn:active{background:rgba(74,71,65,.09)}
  .chips{flex:0 0 auto;display:flex;gap:8px;padding:0 16px 8px}
  .chips button{
    flex:1;padding:7px 0;font-size:12px;font-family:inherit;color:#7B746B;
    background:rgba(255,255,255,.62);border:1px solid rgba(74,71,65,.14);
    border-radius:999px;cursor:pointer;transition:.18s;
  }
  .chips button.on{background:rgba(155,123,94,.24);border-color:rgba(155,123,94,.6);color:#4A3C30}
  #wrap{flex:1 1 auto;position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #toast{
    position:absolute;left:50%;top:10px;transform:translateX(-50%);
    z-index:15;pointer-events:none;
    font-size:12.5px;color:#4A4741;background:rgba(251,248,243,.92);
    border:1px solid rgba(74,71,65,.12);border-radius:999px;
    padding:7px 14px;white-space:nowrap;
    opacity:0;transition:opacity .25s;
    max-width:92%;overflow:hidden;text-overflow:ellipsis;
  }
  #toast.show{opacity:1}
  footer{flex:0 0 auto;display:flex;gap:8px;padding:10px 16px 16px}
  footer button{
    flex:1;padding:13px 0;font-size:13px;font-family:inherit;color:#57524B;
    background:rgba(255,255,255,.66);border:1px solid rgba(74,71,65,.13);
    border-radius:12px;cursor:pointer;transition:.15s;
  }
  footer button:active{background:rgba(74,71,65,.09)}
  #mask{
    position:absolute;inset:0;z-index:20;display:none;
    align-items:center;justify-content:center;background:rgba(237,233,227,.86);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  #mask.show{display:flex}
  .card{text-align:center;padding:28px 30px;border-radius:20px;background:#FBF8F3;border:1px solid rgba(74,71,65,.12);min-width:238px;max-width:340px}
  .card h2{font-size:20px;font-weight:600;margin-bottom:6px}
  .card p{font-size:13px;color:#8A837A;margin-bottom:20px;white-space:pre-line;line-height:1.7;text-align:left}
  .card .row{display:flex;gap:10px}
  .card button{
    flex:1;padding:11px 0;font-size:14px;font-family:inherit;border-radius:11px;cursor:pointer;border:none;
    background:rgba(74,71,65,.07);color:#57524B;
  }
  .card button.pri{background:#9B7B5E;color:#fff}
  #rotate{
    position:fixed;inset:0;z-index:50;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:14px;
    background:#EDE9E3;text-align:center;padding:24px;
  }
  #rotate .ic{width:54px;height:84px;border:2px solid #B4ACA2;border-radius:10px;position:relative}
  #rotate .ic::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:12px;margin:-6px 0 0 -13px;border:2px solid #B4ACA2;border-radius:3px}
  #rotate p{font-size:15px;color:#857E75}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">围堵毛贼<small id="sub">拖动衙役，堵死所有去路</small></div>
    <div class="right">
      <div class="stats">
        <div class="stat"><b id="lv">1</b><span>关卡</span></div>
        <div class="stat"><b id="mv">0</b><span>步数</span></div>
      </div>
      <button class="sndbtn" id="snd" title="音效">♪</button>
    </div>
  </header>

  <div class="chips" id="chips">
    <button data-i="0">简单</button>
    <button data-i="1">普通</button>
    <button data-i="2">困难</button>
    <button data-i="3">地狱</button>
  </div>

  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="toast"></div>
  </div>

  <footer>
    <button id="hint">提示</button>
    <button id="reset">重开</button>
    <button id="skip">新关</button>
  </footer>

  <div id="mask" class="show">
    <div class="card">
      <h2 id="mt">围堵毛贼</h2>
      <p id="mp">栈桥架在水面上，毛贼想跳上岸边的小船逃走。
点选衙役，再点亮起的木梁交点移动——一步只能走到相邻节点，不能和别人挤同一格。
轮到毛贼时他会自己找活路；把他所有去路都堵死即可抓获。
每一局都由求解器验过：按最优走法必有解。</p>
      <div class="row"><button id="go" class="pri">开始</button></div>
    </div>
  </div>
</div>

<div id="rotate">
  <div class="ic"></div>
  <p>请把手机竖过来</p>
</div>

      rk = an.rankOf(after, thief, 1);
      if (an.isCopWin(after, thief, 1) && rk < bestRank) { bestRank = rk; best = ms[i]; }
      sc = 0;
      for (j = 0; j < after.length; j++) sc += bfsToEscape(after[j], after) * 2;
      de = bfsToEscape(thief, after);
      sc += de * 8;
      if (sc > bestScore) { bestScore = sc; stall = ms[i]; }
    }
    var mv = best || stall;
    if (!mv) { toast('这会儿动不了，试试别的衙役'); return; }
    hintMove = mv;
    hintT = performance.now();
    SFX.hint();
    toast(best ? '让这名衙役走到亮圈处，离收网更近一步' : '暂时找不到必胜着，先封住靠船的方向');
  });
  document.getElementById('reset').addEventListener('click', function () { ac(); newGame(); });
  document.getElementById('skip').addEventListener('click', function () {
    ac();
    lvArr[diff] = Math.min(9999, lvArr[diff] + 1);
    save();
    newGame();
  });
  btnGo.addEventListener('click', function () {
    ac();
    var label = btnGo.textContent;
    btnGo.textContent = '开始';
    if (label === '下一关') lvArr[diff] = Math.min(9999, lvArr[diff] + 1);
    save();
    newGame();
  });
  btnSnd.addEventListener('click', function () {
    soundOn = !soundOn;
    btnSnd.style.opacity = soundOn ? 1 : 0.38;
    ac();
    save();
  });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 220); });

  /* ---------- 绘制 ---------- */
  function drawWater(t) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#93B4C8');
    g.addColorStop(0.45, '#7FA6BC');
    g.addColorStop(1, '#6E93AA');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.lineWidth = 1.2;
    var i, y0, x, y;
    for (i = 0; i < 6; i++) {
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.07 + (i % 3) * 0.03) + ')';
      ctx.beginPath();
      y0 = H * (0.12 + i * 0.15);
      for (x = 0; x <= W; x += 7) {
        y = y0 + Math.sin(x * 0.021 + t * 1.4 + i * 1.7) * 3.5 + Math.sin(x * 0.009 - t * 0.8 + i) * 2;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }
  function drawBeam(x1, y1, x2, y2, w) {
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#8A6A3E';
    ctx.lineWidth = w + 2.2;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = '#C9A66B';
    ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,236,196,.4)';
    ctx.lineWidth = Math.max(1.5, w * 0.32);
    ctx.beginPath();
    ctx.moveTo(x1, y1 - w * 0.16); ctx.lineTo(x2, y2 - w * 0.16);
    ctx.stroke();
  }
  function drawBoat(x, y, s) {
    ctx.save();
    ctx.fillStyle = '#8C5A3C';
    ctx.beginPath();
    ctx.moveTo(x - s, y - s * 0.1);
    ctx.quadraticCurveTo(x - s * 0.2, y + s * 0.75, x + s, y - s * 0.05);
    ctx.quadraticCurveTo(x, y + s * 0.22, x - s, y - s * 0.1);
    ctx.fill();
    ctx.fillStyle = '#B88354';
    ctx.beginPath();
    ctx.moveTo(x - s * 0.85, y - s * 0.05);
    ctx.quadraticCurveTo(x, y + s * 0.55, x + s * 0.85, y - s * 0.02);
    ctx.quadraticCurveTo(x, y + s * 0.16, x - s * 0.85, y - s * 0.05);
    ctx.fill();
    ctx.strokeStyle = 'rgba(60,40,25,.25)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x - s * 0.7, y + s * 0.08);
    ctx.quadraticCurveTo(x, y + s * 0.48, x + s * 0.7, y + s * 0.08);
    ctx.stroke();
    ctx.restore();
  }
  function drawNode(x, y, r, isEsc) {
    var g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.12, x, y, r);
    if (isEsc) { g.addColorStop(0, '#F7E2B8'); g.addColorStop(1, '#D2B07A'); }
    else { g.addColorStop(0, '#F6EEDC'); g.addColorStop(1, '#D8C7A6'); }
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = Math.max(1.5, r * 0.14);
    ctx.strokeStyle = isEsc ? '#A8844E' : '#A89070';
    ctx.stroke();
  }
  function drawLegal(x, y, r, t) {
    var pulse = 0.72 + Math.sin(t * 5) * 0.18;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.72, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(122,141,124,' + (0.28 * pulse) + ')';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y, r * 0.72, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(122,141,124,' + (0.7 * pulse) + ')';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  function drawOfficer(x, y, s, selected, t) {
    if (selected) {
      ctx.beginPath();
      ctx.arc(x, y, s * 1.35 + Math.sin(t * 6) * s * 0.08, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(212,168,75,.85)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    ctx.fillStyle = '#D4A84B';
    ctx.beginPath();
    rr(x - s * 0.42, y - s * 0.05, s * 0.84, s * 0.78, s * 0.22);
    ctx.fill();
    ctx.fillStyle = '#3F4A41';
    ctx.fillRect(x - s * 0.42, y + s * 0.38, s * 0.84, s * 0.12);
    ctx.fillStyle = '#E8C9A8';
    ctx.beginPath(); ctx.arc(x, y - s * 0.28, s * 0.32, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4A4741';
    ctx.beginPath();
    ctx.arc(x - s * 0.12, y - s * 0.30, s * 0.05, 0, Math.PI * 2);
    ctx.arc(x + s * 0.12, y - s * 0.30, s * 0.05, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#C45C4A';
    ctx.beginPath();
    ctx.moveTo(x, y - s * 0.95);
    ctx.lineTo(x - s * 0.52, y - s * 0.40);
    ctx.lineTo(x + s * 0.52, y - s * 0.40);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#A84A3A';
    ctx.fillRect(x - s * 0.58, y - s * 0.44, s * 1.16, s * 0.1);
    ctx.fillStyle = '#E8C9A8';
    ctx.beginPath(); ctx.arc(x, y - s * 0.42, s * 0.07, 0, Math.PI * 2); ctx.fill();
  }
  function drawThief(x, y, s) {
    ctx.fillStyle = '#3A3835';
    ctx.beginPath();
    rr(x - s * 0.4, y - s * 0.1, s * 0.8, s * 0.85, s * 0.28);
    ctx.fill();
    ctx.fillStyle = '#C4B49A';
    ctx.beginPath(); ctx.arc(x, y - s * 0.28, s * 0.30, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2A2826';
    ctx.fillRect(x - s * 0.34, y - s * 0.38, s * 0.68, s * 0.16);
    ctx.fillStyle = '#EDE9E3';
    ctx.beginPath();
    ctx.arc(x - s * 0.12, y - s * 0.30, s * 0.045, 0, Math.PI * 2);
    ctx.arc(x + s * 0.12, y - s * 0.30, s * 0.045, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2F2D2B';
    ctx.beginPath();
    ctx.arc(x, y - s * 0.48, s * 0.38, Math.PI, 0);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - s * 0.38, y - s * 0.48);
    ctx.quadraticCurveTo(x, y - s * 0.95, x + s * 0.38, y - s * 0.48);
    ctx.fill();
  }
  function drawHint(x, y, r) {
    var age = (performance.now() - hintT) / 1000;
    var a = 0.35 + Math.sin(age * 6) * 0.25;
    ctx.beginPath();
    ctx.arc(x, y, r * 1.05 + Math.sin(age * 5) * r * 0.08, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(196,92,74,' + a + ')';
    ctx.lineWidth = 3.5;
    ctx.stroke();
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function piecePos(from, to, k) {
    var a = nodeXY(from), b = nodeXY(to);
    return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
  }
  function draw(t) {
    if (!layout) return;
    ctx.clearRect(0, 0, W, H);
    drawWater(t);
    var i, e, a, b, p;
    for (i = 0; i < layout.nodes.length; i++) {
      if (!escapeSet[i]) continue;
      p = nodeXY(i);
      drawBoat(p[0], p[1] + nodeR * 1.15, nodeR * 1.05);
    }
    for (i = 0; i < layout.edges.length; i++) {
      e = layout.edges[i];
      a = nodeXY(e[0]); b = nodeXY(e[1]);
      drawBeam(a[0], a[1], b[0], b[1], Math.max(4, nodeR * 0.42));
    }
    if (sel >= 0 && phase === 'pick') {
      for (i = 0; i < legal.length; i++) {
        p = nodeXY(legal[i]);
        drawLegal(p[0], p[1], nodeR, t);
      }
    }
    for (i = 0; i < layout.nodes.length; i++) {
      p = nodeXY(i);
      drawNode(p[0], p[1], nodeR, !!escapeSet[i]);
    }
    if (hintMove && phase === 'pick') {
      p = nodeXY(officers[hintMove.from]);
      drawHint(p[0], p[1], nodeR);
      p = nodeXY(hintMove.to);
      drawHint(p[0], p[1], nodeR);
    }
    for (i = rings.length - 1; i >= 0; i--) {
      var age = (performance.now() - rings[i].t0) / 450;
      if (age >= 1) { rings.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(rings[i].x, rings[i].y, nodeR * (0.5 + age * 1.6), 0, Math.PI * 2);
      ctx.strokeStyle = rings[i].c;
      ctx.globalAlpha = 0.45 * (1 - age);
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    var s = nodeR * 0.95;
    var copPos = [], thiefPos = nodeXY(thief);
    for (i = 0; i < officers.length; i++) copPos.push(nodeXY(officers[i]));
    if (anim) {
      var k = Math.min(1, (performance.now() - anim.t0) / anim.dur);
      var ease = k < 0.5 ? 2 * k * k : -1 + (4 - 2 * k) * k;
      if (anim.kind === 'cop') copPos[anim.idx] = piecePos(anim.from, anim.to, ease);
      else thiefPos = piecePos(anim.from, anim.to, ease);
      if (k >= 1) onAnimDone();
    }
    for (i = 0; i < officers.length; i++) {
      drawOfficer(copPos[i][0], copPos[i][1] - s * 0.15, s, sel === i, t);
    }
    drawThief(thiefPos[0], thiefPos[1] - s * 0.15, s);
    for (i = confetti.length - 1; i >= 0; i--) {
      var f = confetti[i];
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rot);
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
      ctx.fillStyle = f.c;
      ctx.fillRect(-f.size / 2, -f.size / 2, f.size, f.size * 0.62);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  function step(dt) {
    var i, f;
    for (i = confetti.length - 1; i >= 0; i--) {
      f = confetti[i];
      f.vy += 460 * dt;
      f.x += f.vx * dt; f.y += f.vy * dt;
      f.rot += f.vr * dt;
      f.life -= dt;
      if (f.life <= 0) confetti.splice(i, 1);
    }
  }

  /* ---------- 启动 ---------- */
  load();
  btnSnd.style.opacity = soundOn ? 1 : 0.38;
  layoutIdx = 0;
  layout = LAYOUTS[0];
  adj = buildAdj(layout.nodes, layout.edges);
  escapeSet = buildEscape(layout.nodes, layout.escapes);
  officers = [3, 5, 7, 9];
  thief = 0;
  resize();

  var lastT = 0;
  function frame(ts) {
    var t = ts / 1000, dt = lastT ? Math.min(0.05, t - lastT) : 0.016;
    lastT = t;
    step(dt);
    draw(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
